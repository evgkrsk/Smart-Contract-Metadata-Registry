# -*- mode: yaml; mode: view -*-
---
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: pretty-format-json
        args:
          - --autofix
      - id: check-case-conflict
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--format, parsable, -c, .yamllint]
  - repo: local
    hooks:
      - id: check-lowercase-address
        name: Contract address filename must be lowercase hex
        entry: Filename contains uppercase hex — rename address to lowercase
        language: fail
        files: ^[^/]+/0x[0-9a-f]*[A-F][0-9a-fA-F]*\.json$
